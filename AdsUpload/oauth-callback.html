<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Completing secure Declan Energy Dropbox authentication." />
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Dropbox OAuth Callback</title>
    <link rel="icon" type="image/png" sizes="any" href="../logo.png?v=2">
    <link rel="stylesheet" href="oauth-callback.css">
</head>
<body>
    <div class="container">
        <h1>🔐 Connecting Dropbox...</h1>
        <div class="spinner"></div>
        <p class="message">Please wait while we complete your Dropbox authentication.</p>
        <div id="errorContainer"></div>
    </div>

    <script type="module">
        import NAVIGATION_CONFIG from './navigation-config.js';

        (async () => {
            try {
                // Get authorization code from URL
                const params = new URLSearchParams(window.location.search);
                const code = params.get('code');
                const state = params.get('state');
                const error = params.get('error');

                if (error) {
                    throw new Error(`Dropbox OAuth error: ${error}`);
                }

                if (!code) {
                    throw new Error('No authorization code received from Dropbox');
                }

                // Import OAuth handler
                const { exchangeCodeForToken } = await import('./dropbox-oauth-handler.js');

                // Exchange code for token
                await exchangeCodeForToken(code, state);

                // Redirect back to the original page that initiated Dropbox auth
                const returnTo = sessionStorage.getItem('dropboxReturnTo');
                sessionStorage.removeItem('dropboxReturnTo');
                if (returnTo) {
                    window.location.href = returnTo;
                } else {
                    NAVIGATION_CONFIG.redirectAfterOAuth();
                }
            } catch (err) {
                console.error('[OAUTH-CALLBACK]', err);
                document.getElementById('errorContainer').innerHTML = `
                    <div class="error">
                        <strong>Authentication Failed</strong><br>
                        ${err.message}<br><br>
                        <a href="${NAVIGATION_CONFIG.oauth.errorBackToApp}" style="color: #667eea; text-decoration: none;">← Back to App</a>
                    </div>
                `;
            }
        })();
    </script>
</body>
</html>
